<script>
const paths={chat:'M4 4h16v12H9l-5 4z',inbox:'M4 4h16v15H4z M4 12h4l2 3h4l2-3h4',work:'M8 6V4h8v2 M3 7h18v13H3z M3 12h18',folder:'M3 6h6l2 2h10v12H3z',branch:'M7 3v12a4 4 0 0 0 4 4h6 M7 7h8a3 3 0 0 0 3-3 M5 3h4 M15 2h5v4 M15 17h5v4',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',plus:'M12 5v14 M5 12h14',search:'M15 15l5 5 M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',menu:'M4 6h16 M4 12h16 M4 18h16',down:'m7 9 5 5 5-5',right:'m9 5 7 7-7 7',left:'m15 5-7 7 7 7',activity:'M3 12h4l3-8 4 16 3-8h4',check:'m5 12 4 4L19 6',arrow:'M12 19V5 M6 11l6-6 6 6',copy:'M8 8h12v13H8z M16 8V3H3v13h5',close:'m6 6 12 12 M6 18 18 6',file:'M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h6',clock:'M12 8v5l3 2 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`;
function hydrateIcons(){document.querySelectorAll('[data-icon]').forEach(node=>node.innerHTML=icon(node.dataset.icon));document.querySelectorAll('.nav-item').forEach(node=>node.setAttribute('aria-label',node.querySelector('.nav-label')?.textContent||'主导航'));}
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={A:['对话优先','推荐 · 过程按需展开'],B:['伴随详情','对话与执行并排'],C:['任务工作台','并行工作优先']};
const params=new URLSearchParams(location.search);
const state={variant:labels[params.get('variant')]?params.get('variant'):'A',scene:['running','idle','parallel','question','done'].includes(params.get('scene'))?params.get('scene'):'running',draft:'',details:false,queued:'',messages:[],timers:[],questionChoice:'compat',stopped:false,context:62};
function setUrl(){const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('scene',state.scene);history.replaceState(null,'',url);}
function isRunning(){return ['running','parallel','question'].includes(state.scene)&&!state.stopped;}
function foot(time='10:19',extra=''){return `<div class="message-meta">${extra}<span>${time}</span><button aria-label="复制这条消息" data-copy>${icon('copy')}</button></div>`;}
function user(text,time='10:18',receipt=''){return `<div class="message user"><div class="bubble">${escapeHtml(text)}</div>${foot(time,receipt)}</div>`;}
function assistant(text,extra=''){return `<div class="assistant"><div class="avatar">CF</div><div class="answer">${text}${extra}</div></div>`;}
function steps(){if(state.scene==='parallel')return [{name:'回调逻辑审计',note:'已核查 12 个入口 · 2 条发现',status:'done'},{name:'iOS 行为审计',note:'已检查深链与应用恢复',status:'done'},{name:'macOS 行为审计',note:'正在复核多窗口回调',status:'running'},{name:'交叉核验与总结',note:'等待 3 份结果汇总',status:'pending'}];return [{name:'定位重复跳转的触发位置',note:'回调监听和路由更新已核对',status:'done'},{name:'修复重复导航',note:'保留现有未提交改动',status:'done'},{name:'验证 iOS 与 macOS 回调',note:state.scene==='done'?'示例：8 项检查通过，实机尚未验证':'已纳入两端覆盖的补充要求',status:state.scene==='done'?'done':state.stopped?'pending':'running'}];}
function stepsHtml(){return steps().map(step=>`<div class="step ${step.status}"><span class="step-state">${step.status==='done'?'✓':step.status==='running'?'•':'·'}</span><div class="step-info"><strong>${step.name}</strong><small>${step.note}</small></div><span class="label">${step.status==='done'?'完成':step.status==='running'?'进行中':'等待'}</span></div>`).join('');}
function summary(){const done=state.scene==='done',parallel=state.scene==='parallel';return `<button class="run-summary" data-details><span class="run-icon">${icon(done?'check':'activity')}</span><span class="run-description"><strong>${done?'修改与检查已结束':parallel?'并行审计中 · 正在复核 macOS 行为':state.stopped?'本轮已中断':'正在验证两端回调行为'}</strong><small>${done?'3 个文件 · 8 项检查通过 · 实机尚未验证':parallel?'2 / 4 个阶段已完成 · 3 个研究方向':'2 / 3 个步骤已完成 · 1 条补充要求已纳入'}</small></span><span class="chevron">${icon('right')}</span></button>${state.details?`<div class="inline-details">${stepsHtml()}</div>`:''}`;}
function replyBody(){return `<h2>已处理重复导航的触发点</h2><p>登录成功后只提交一次路由更新，避免回调和状态监听同时触发跳转。</p><ul><li>iOS：检查深链回调与应用恢复。</li><li>macOS：检查窗口恢复与重复回调。</li><li>保留当前工作区中已有的未提交改动。</li></ul><button class="artifact" data-diff>${icon('file')}<span class="artifact-title"><strong>回调去重与两端验证</strong><small>3 个示例文件 · 查看改动</small></span><span class="delta">+61 −14</span></button><div class="evidence"><span>✓ 8 项检查通过 · 演示</span><span class="unverified">实机验证未执行</span></div><p style="font-size:11px;color:#879b80">代码检查与实际设备验证分别记录，你可以直接继续追问或要求修改。</p>`;}
function renderThread(){let html='<div class="date-label">今天 · 10:18</div>';if(state.scene==='idle'){html+=user('这个项目的登录回调是怎么处理的？');html+=assistant('<h2>登录回调主要经过三个环节</h2><p>先接收深链参数，校验登录状态，再统一交给路由更新。iOS 与 macOS 共用状态处理，各自保留应用恢复的入口。</p><p>如果你要排查重复跳转，我可以接着检查回调监听和路由提交的位置。</p>',foot('10:18'));}else if(state.scene==='parallel'){html+=user('帮我全面审计登录回调，分别检查 iOS、macOS 和共享逻辑，最后交叉核验。');html+=assistant('<p>按三个方向并行核查，再统一比较发现。当前只做只读审计。</p>'+summary()+'<p style="font-size:11px;color:#8d9d85">已经确认一个共享入口存在重复提交的可能，正在复核是否影响 macOS。</p>');}else if(state.scene==='question'){html+=user('修复登录回调重复跳转，保留未提交改动。');html+=assistant('<p>已找到两处导航触发点，需要确认这次修改的兼容范围。</p><div class="question-card"><h3>已有深链入口需要一起保持兼容吗？</h3><label><input type="radio" name="scope" value="compat" checked>兼容现有深链入口（推荐）</label><label><input type="radio" name="scope" value="login">仅调整本次登录回调</label><button class="primary-small" data-confirm-question>确认并继续</button></div><div class="run-state">等待你的回答 · 回答后继续原任务</div>');}else{html+=user('排查登录回调后重复跳转的问题，保留现有未提交改动。');html+=assistant('<details class="thought"><summary>思考摘要</summary><p>先核对回调与状态监听是否都在提交导航，再分别检查 iOS、macOS 的恢复入口。这里仅展示模型可提供的摘要。</p></details><p>已定位重复导航的触发位置，正在核对修改后的回调行为。</p>');html+=user('补充：iOS 和 macOS 都要覆盖。','10:19',`<button class="receipt" data-locate="linked-reply">${icon('check')}${state.scene==='done'?'已在本轮回复':'已纳入本轮'} ↗</button>`);html+=assistant(`<div id="linked-reply">${state.scene==='done'?replyBody():'<p>已把这条补充要求纳入本轮：iOS 回调与 macOS 窗口恢复都会检查。</p>'+summary()}</div>`,state.scene==='done'?foot('10:21','<span>本轮完成</span>'):'');if(state.stopped)html+=assistant('<div class="stopped">本轮已中断，已完成的修改保留。<br>可以查看改动，或继续发送要求。</div>');}
for(const message of state.messages){const receipt=`<button class="receipt ${message.status==='已投递'?'pending':''}" data-locate="reply-${message.id}" ${message.status==='已投递'?'disabled':''}>${icon(message.status==='已投递'?'clock':'check')}${message.status} ↗</button>`;html+=user(message.text,'刚刚',receipt);if(message.status==='已纳入本轮')html+=assistant(`<p id="reply-${message.id}">已将“${escapeHtml(message.text)}”纳入当前验证范围。</p>`);}
document.getElementById('thread').innerHTML=html;}
function renderDetails(){document.getElementById('details').innerHTML=`<div class="detail-title">${icon('activity')}执行详情<button class="icon-btn" data-close-details aria-label="关闭执行详情">${icon('close')}</button></div><p>${state.scene==='parallel'?'三路只读研究，汇总前交叉核验。':'从原始要求到验证结果，集中查看。'}</p><div class="detail-section">${state.scene==='parallel'?'并行阶段':'当前任务'}</div>${stepsHtml()}<div class="detail-section">补充要求</div><div class="branch-card"><b>iOS 和 macOS 都要覆盖</b><br>已纳入当前轮次，可定位对应回复。</div><div class="detail-section">${state.scene==='parallel'?'工作范围':'执行范围'}</div><div class="branch-card"><b>Reminis · ${state.scene==='parallel'?'只读审计':'main'}</b><br>${state.scene==='parallel'?'多个子任务继承同一项目范围。':'本次修改保留现有未提交改动。'}</div><div class="detail-section">预算 · 演示</div><div class="budget"><span>本轮估算</span><b>$0.42 / $2.00</b></div><div class="budget-line"></div><div class="prototype-note-inline">本面板为交互演示。阶段、检查和用量均为合成数据。</div>`;document.getElementById('workspace').innerHTML=`<div class="eyebrow">REMINIS / 工作详情</div><h2>${state.scene==='parallel'?'登录回调并行审计':'登录回调重复跳转排查'}</h2><p class="work-sub">沿用当前会话 · 目标、过程与交付放在一起</p>${summary()}<div class="work-table">${stepsHtml()}</div><div class="work-toolbar"><button class="quiet-btn" data-diff>${icon('file')}查看改动</button><button class="quiet-btn" data-finish>${icon('check')}查看交付示意</button></div><div class="detail-section">后续阶段：并行修改时的文件隔离</div><div class="branch-card"><b>独立分支 · fix/login-callback</b><br>演示未来受管理的工作目录。合并前先查看差异；原工作区保留。</div><div class="prototype-note-inline">工作台是可选布局。普通问答仍可直接在右侧对话中进行。</div>`;}
function updateComposer(){const value=state.draft.trim();document.getElementById('draft').placeholder=isRunning()?'补充要求，直接发给当前任务…':'继续追问，或说说你想做什么…';const send=document.getElementById('send');send.innerHTML=value||!isRunning()?icon('arrow'):'<span class="stop-square"></span>';send.setAttribute('aria-label',value?(isRunning()?'补充到当前任务':'发送消息'):isRunning()?'中断当前运行':'发送消息');document.getElementById('input-hint').textContent=state.queueMode?'排队为下一轮':isRunning()?'补充到当前任务':'项目连续对话';document.getElementById('queue').innerHTML=state.queued?`<div class="queue-preview">${icon('clock')}<span>下一轮：${escapeHtml(state.queued)}</span><button data-remove-queue aria-label="取消排队">${icon('close')}</button></div>`:'';}
function render(){const scroll=document.getElementById('thread');const oldTop=scroll.scrollTop,nearBottom=scroll.scrollHeight-scroll.clientHeight-scroll.scrollTop<70;const draft=document.getElementById('draft'),focus=document.activeElement===draft,start=draft.selectionStart,end=draft.selectionEnd;document.body.dataset.variant=state.variant;document.getElementById('scene').value=state.scene;document.getElementById('variant-label').innerHTML=`<b>${state.variant} — ${labels[state.variant][0]}</b><small>${labels[state.variant][1]} · ← → 切换</small>`;document.getElementById('run-label').textContent=state.stopped?'已中断':state.scene==='done'||state.scene==='idle'?'本轮完成':state.scene==='question'?'等待回答':state.scene==='parallel'?'并行审计':'正在验证';document.getElementById('chat-title').textContent=state.scene==='parallel'?'登录回调并行审计':state.scene==='idle'?'登录回调实现说明':'登录回调重复跳转排查';document.getElementById('branch-label').textContent='main';renderThread();renderDetails();scroll.scrollTop=nearBottom?scroll.scrollHeight:oldTop;document.querySelector('.conversation.selected small').innerHTML=escapeHtml(document.getElementById('run-label').textContent)+' <i class="dot"></i>';draft.value=state.draft;updateComposer();hydrateIcons();setUrl();if(focus){draft.focus();draft.setSelectionRange(start,end);}}
function clearTimers(){state.timers.forEach(clearTimeout);state.timers=[];}
function scene(value){clearTimers();state.scene=value;state.messages=[];state.stopped=false;state.details=false;state.queued='';state.queueMode=false;closeDetails();render();}
function variant(offset){const keys=Object.keys(labels);state.variant=keys[(keys.indexOf(state.variant)+offset+keys.length)%keys.length];closeDetails();render();}
function toast(text){const node=document.getElementById('toast');node.textContent=text;node.hidden=false;setTimeout(()=>node.hidden=true,2500);}
function closeDetails(){document.getElementById('details').classList.remove('mobile-open');document.getElementById('drawer-backdrop').classList.remove('open');}
function details(){if(innerWidth<=720){document.getElementById('details').classList.add('mobile-open');document.getElementById('drawer-backdrop').classList.add('open');}else if(state.variant==='A'){state.details=!state.details;render();}else if(state.variant==='B'){toast('右侧集中显示当前执行详情');}else{toast('左侧工作台显示阶段与交付');}}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function modal(title,body){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><button class="icon-btn" data-close-modal aria-label="关闭窗口">${icon('close')}</button></header>${body}</section></div>`;}
function benefits(){modal('你会感受到的变化',`<p>项目问答依旧直接可用。优化主要减少不确定感、界面噪声与重复操作。</p><div class="benefit-row"><span class="benefit-num">01</span><div><h3>补充要求，有迹可循</h3><p>发送后区分已投递、已纳入本轮和本轮完成。点气泡下面的状态，定位对应回复。</p><button data-demo="running">体验插话 →</button></div></div><div class="benefit-row"><span class="benefit-num">02</span><div><h3>看一行进度，需要时再展开</h3><p>当前阶段、子任务、错误和用量集中显示。普通心跳合并，思考摘要可选。</p><button data-demo="details">展开执行详情 →</button></div></div><div class="benefit-row"><span class="benefit-num">03</span><div><h3>中断、继续、交付，状态清楚</h3><p>空输入时主按钮用于中断；有文字时直接补充。交付区分改动、已运行检查和未验证项。</p><button data-demo="done">看交付结果 →</button></div></div><div class="benefit-row"><span class="benefit-num">04</span><div><h3>复杂任务分工，修改彼此隔离<span class="phase-label">后续阶段</span></h3><p>审计和调研可以并行，最后交叉核验。并行修改时再提供独立分支与工作目录。</p><button data-demo="parallel">看并行审计 →</button></div></div><p style="margin-bottom:0;font-size:10px">本原型展示建议体验，不代表全部功能已经实现；不对速度、费用或成功率作量化承诺。</p>`);}
function send(){const text=state.draft.trim();if(!text){if(isRunning()){clearTimers();state.stopped=true;render();toast('演示：本轮已中断，草稿与已完成修改保留');}return;}if(state.queueMode){state.queued=text;state.draft='';state.queueMode=false;render();return;}if(!isRunning()){state.scene='running';state.stopped=false;}const id=Date.now(),message={id,text,status:'已投递'};state.messages.push(message);state.draft='';render();document.getElementById('thread').scrollTop=1e6;state.timers.push(setTimeout(()=>{message.status='已纳入本轮';render();document.getElementById('thread').scrollTop=1e6;},1600));}
document.getElementById('draft').addEventListener('input',event=>{state.draft=event.target.value;updateComposer();});document.getElementById('draft').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send();}});document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();send();});document.getElementById('scene').addEventListener('change',event=>scene(event.target.value));document.getElementById('previous').onclick=()=>variant(-1);document.getElementById('next').onclick=()=>variant(1);document.getElementById('benefits').onclick=benefits;document.getElementById('header-details').onclick=details;document.getElementById('drawer-backdrop').onclick=closeDetails;document.getElementById('files').onclick=()=>modal('本次改动 · 演示',`<p>示例文件仅用于展示交付层级，不是当前工作区的实际改动。</p><div class="diff">lib/auth/callback_handler.dart    +28 −9\nlib/router/auth_redirect.dart     +17 −5\ntest/auth_callback_test.dart      +16 −0</div><button class="primary-small" data-diff>查看示意差异</button>`);document.getElementById('more').onclick=()=>{document.getElementById('more-menu').hidden=!document.getElementById('more-menu').hidden;};document.getElementById('model').onclick=()=>toast('模型、权限与高级参数保留在一处设置中');document.getElementById('new-chat').onclick=()=>{state.draft='';scene('idle');};document.getElementById('mobile-nav').onclick=()=>modal('项目与会话',`<p>选择项目后即可直接问答。</p><button class="artifact" data-demo="running"><span class="artifact-title"><strong>Reminis · 登录回调排查</strong><small>当前会话</small></span></button><button class="artifact" data-demo="idle"><span class="artifact-title"><strong>CoderFleet · 项目问答</strong><small>直接提问，无需建工作卡片</small></span></button>`);
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.matches('[data-details]'))details();if(button.matches('[data-close-details]')){closeDetails();if(innerWidth>720&&state.variant==='B'){state.variant='A';render();}}if(button.matches('[data-locate]')){const node=document.getElementById(button.dataset.locate);if(node){node.scrollIntoView({behavior:'smooth',block:'center'});node.classList.add('reply-highlight');setTimeout(()=>node.classList.remove('reply-highlight'),2200);}toast('这条补充要求对应到本轮回复');}if(button.matches('[data-diff]'))modal('示意差异',`<p>原型合成内容 · 正式实现中展示实际文件和检查证据。</p><div class="diff">  void onAuthCallback(AuthState state) {\n+   if (state.requestId == lastHandledId) return;\n+   lastHandledId = state.requestId;\n    router.updateSession(state.session);\n  }\n\n+ test('iOS 重复回调只导航一次', ...);\n+ test('macOS 恢复不重复提交路由', ...);</div>`);if(button.matches('[data-close-modal]'))closeModal();if(button.matches('[data-finish]'))scene('done');if(button.matches('[data-demo]')){const value=button.dataset.demo;closeModal();if(value==='details'){state.details=true;if(innerWidth<=720)details();else render();}else scene(value);}if(button.matches('[data-confirm-question]')){const choice=document.querySelector('input[name="scope"]:checked')?.value;scene('running');toast(choice==='compat'?'已回答：兼容现有深链入口，继续原任务':'已回答：仅调整登录回调，继续原任务');}if(button.matches('[data-copy]')){navigator.clipboard?.writeText(button.closest('.message')?.querySelector('.bubble')?.textContent||button.closest('.answer')?.innerText||'');toast('已复制演示内容');}if(button.matches('[data-remove-queue]')){state.queued='';updateComposer();}if(button.matches('[data-action]')){document.getElementById('more-menu').hidden=true;const action=button.dataset.action;if(action==='queue'){state.queueMode=!state.queueMode;updateComposer();document.getElementById('draft').focus();}if(action==='context'){state.context=34;document.querySelector('.context-pill').innerHTML='<span></span>上下文 34%';toast('演示：整理后保留当前目标、关键决定和未完成项');}if(action==='settings')modal('高级设置 · 示意',`<p>低频配置集中在这里，日常聊天直接发送即可。</p><div class="branch-card"><b>模型</b>　跟随当前会话<br><b>权限</b>　按项目设置<br><b>预算</b>　单任务上限 $2.00（演示）<br><b>思考摘要</b>　需要时展开<br><b>排队发送</b>　按消息单独选择</div>`);}if(button.dataset.conversation){state.draft='';scene(button.dataset.conversation==='login'?'running':'idle');toast('演示切换会话；正式版本保留各会话草稿');}if(button.dataset.nav){if(button.dataset.nav==='chat')scene('running');else if(button.dataset.nav==='work'){state.variant='C';scene('parallel');}else modal(button.textContent.trim()||'产品入口',`<p>该入口沿用现有产品，本原型重点展示项目聊天、补充消息与执行详情。</p><button class="primary-small" data-close-modal>返回当前对话</button>`);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();closeDetails();document.getElementById('more-menu').hidden=true;}if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();variant(event.key==='ArrowLeft'?-1:1);}});render();
</script>
