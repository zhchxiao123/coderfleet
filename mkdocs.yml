site_name: CoderFleet
site_description: 把多个 AI 编程账号放进各自的容器里，在一个 App 里对话、审批和验收
site_url: https://zhchxiao123.github.io/coderfleet/
repo_name: zhchxiao123/coderfleet
repo_url: https://github.com/zhchxiao123/coderfleet
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/logo-mark.png
  favicon: assets/logo-mark.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

# 设计过程文档（调研、计划、复盘、决策）和给 agent 看的说明不进文档站。
exclude_docs: |
  adr/
  agents/
  incidents/
  plans/
  reports/
  research/
  assets/coderfleet-icon-concept/

nav:
  - 首页: index.md
  - 开始:
      - 安装: install.md
      - 第一次使用: quickstart.md
  - 使用:
      - 账号: accounts.md
      - 项目: projects.md
      - 对话: chat.md
      - 做完为止: jobs.md
      - 定时: schedules.md
      - 手机 App: mobile.md
      - 远程机器: remote.md
      - 机器助手: helper.md
  - 参考:
      - 网络与代理: network.md
      - 后端命令行: cli.md
      - 常见问题: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
